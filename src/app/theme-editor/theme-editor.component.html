<div class="h-full flex flex-col bg-card">
    <!-- Header -->
    <div class="p-6 border-b border-border">
        <h2 class="text-xl font-bold text-foreground">Theme Editor</h2>
        <p class="text-sm text-muted-foreground mt-1">Customize your design system colors and styles</p>
    </div>

    <!-- Tabs -->
    <div class="border-b border-border bg-muted/30">
        <div class="flex px-6">
            <button *ngFor="let group of groups; let i = index" (click)="selectedTabIndex = i"
                [class.border-primary]="selectedTabIndex === i" [class.text-primary]="selectedTabIndex === i"
                [class.bg-background]="selectedTabIndex === i" [class.text-muted-foreground]="selectedTabIndex !== i"
                class="px-6 py-3 text-sm font-semibold border-b-2 transition-all hover:text-foreground hover:bg-background/50 rounded-t-md">
                {{ group }}
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-6">
        <div *ngFor="let group of groups; let i = index" [hidden]="selectedTabIndex !== i">

            <!-- Subgroups as Accordions -->
            <div class="space-y-3">
                <div *ngFor="let subgroup of getSubgroups(group)"
                    class="border border-border rounded-lg overflow-hidden bg-card shadow-sm">
                    <!-- Accordion Header -->
                    <button (click)="toggleAccordion(subgroup)"
                        class="w-full px-5 py-4 flex items-center justify-between bg-muted/50 hover:bg-muted transition-colors">
                        <span class="text-sm font-semibold text-foreground">{{ subgroup }}</span>
                        <svg class="w-5 h-5 text-muted-foreground transition-transform"
                            [class.rotate-180]="isAccordionOpen(subgroup)" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Accordion Content -->
                    <div *ngIf="isAccordionOpen(subgroup)" class="p-5 space-y-5 bg-background">
                        <div *ngFor="let variable of getVariablesBySubgroup(group, subgroup)" class="space-y-2">
                            <label class="block text-sm font-medium text-foreground">{{ variable.label }}</label>
                            <p *ngIf="variable.description" class="text-xs text-muted-foreground -mt-1 mb-2">
                                {{ variable.description }}
                            </p>

                            <!-- Color Input -->
                            <div *ngIf="variable.type === 'color'" class="flex items-center gap-3">
                                <input type="color" [value]="getHexValue(variable.name)"
                                    (input)="updateValue(variable, $event)" class="h-11 w-11 cursor-pointer">

                                <input type="text" [value]="getHexValue(variable.name)"
                                    (input)="updateValue(variable, $event)" placeholder="#000000"
                                    class="flex-1 px-4 py-2.5 text-sm font-mono bg-card border border-input rounded-lg focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent text-foreground uppercase tracking-wide shadow-sm">
                            </div>

                            <!-- Radius, Spacing, Typography Input with Slider -->
                            <div
                                *ngIf="variable.type === 'radius' || variable.type === 'spacing' || variable.type === 'typography'">
                                <div class="flex items-center justify-between gap-4">
                                    <input type="range" [value]="variable.value" [min]="variable.min || 0"
                                        [max]="variable.max || 10" [step]="variable.step || 0.1"
                                        (input)="updateValue(variable, $event)"
                                        class="flex-1 h-2 bg-muted rounded-lg appearance-none cursor-pointer accent-primary">
                                    <span class="min-w-[5rem] text-right text-sm font-mono text-foreground">
                                        {{variable.value}}{{variable.unit}}
                                    </span>
                                </div>
                            </div>

                            <!-- Number Input with Slider -->
                            <div *ngIf="variable.type === 'number'">
                                <div class="flex items-center justify-between gap-4">
                                    <input type="range" [value]="variable.value" [min]="variable.min || 0"
                                        [max]="variable.max || 10" [step]="variable.step || 0.1"
                                        (input)="updateValue(variable, $event)"
                                        class="flex-1 h-2 bg-muted rounded-lg appearance-none cursor-pointer accent-primary">
                                    <span class="min-w-[5rem] text-right text-sm font-mono text-foreground">
                                        {{variable.value}}{{variable.unit || ''}}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Shadow Preview Card (only for Box Shadow subgroup) -->
                        <div *ngIf="subgroup === 'Box Shadow'" class="mt-6 pt-6 border-t border-border">
                            <p class="text-sm font-medium text-foreground mb-3">Preview</p>
                            <div class="flex items-center justify-center p-8 bg-muted/30 rounded-lg">
                                <div class="w-32 h-32 bg-card rounded-lg flex items-center justify-center text-sm text-muted-foreground"
                                    [style.box-shadow]="'var(--shadow)'">
                                    Shadow
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
