<div class="editor-container">
    <div class="editor-header">
        <h2>Theme Editor</h2>
    </div>

    <mat-tab-group [(selectedIndex)]="selectedTabIndex" animationDuration="0ms" class="editor-tabs">
        <mat-tab *ngFor="let group of groups" [label]="group">
            <div class="variable-list">
                <ng-container *ngFor="let variable of getVariablesByGroup(group)">
                    <div class="variable-item">
                        <div class="variable-header">
                            <div class="variable-label">{{ variable.label }}</div>
                            <div class="variable-description" *ngIf="variable.description">
                                {{ variable.description }}
                            </div>
                        </div>

                        <div class="input-wrapper" [ngSwitch]="variable.type">
                            <!-- Color Picker -->
                            <div *ngSwitchCase="'color'" class="color-input-group">
                                <div class="color-preview" [style.background-color]="'oklch(' + variable.value + ')'">
                                    <input type="text" [value]="variable.value" (input)="updateValue(variable, $event)"
                                        class="hex-input">
                                </div>
                            </div>

                            <!-- Text Input -->
                            <div *ngSwitchDefault>
                                <input type="text" [value]="variable.value" (input)="updateValue(variable, $event)"
                                    class="text-input">
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
