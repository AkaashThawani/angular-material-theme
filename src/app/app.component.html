<div class="flex h-screen w-full bg-background text-foreground overflow-hidden">
    <!-- Sidebar: Theme Editor -->
    <aside class="border-r border-border bg-card overflow-y-auto">
        <app-theme-editor [activeSection]="0"></app-theme-editor>
    </aside>

    <!-- Main Content: Components Showcase -->
    <main class="flex-1 overflow-y-auto bg-background p-8">
        <div class="max-w-8xl mx-auto space-y-8">
            <div class="space-y-2">
                <h1 class="text-3xl font-bold tracking-tight">Components Showcase</h1>
                <p class="text-muted-foreground">Real-time Preview of Spartan UI Components</p>
            </div>

            <app-components-showcase></app-components-showcase>
        </div>
    </main>
</div>
